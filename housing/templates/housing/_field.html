<div class="field {% if f.errors %}field--invalid{% endif %}">
    <label class="field__label" for="{{ f.id_for_label }}">
        {{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}
    </label>
    {{ f }}
    {% if f.help_text %}<span class="field__hint">{{ f.help_text }}</span>{% endif %}
    {% for e in f.errors %}<span class="field__error">{{ e }}</span>{% endfor %}
</div>
