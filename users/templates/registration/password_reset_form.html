{% extends "housing/base.html" %}
{% block title %}Сброс пароля — Рязань.Аренда{% endblock %}
{% block content %}
<main class="page"><div class="container">
    <div class="auth-card narrow">
        <div class="page-head">
            <h1 class="page-head__title">Сброс пароля</h1>
            <p class="page-head__subtitle">Укажите email — пришлём ссылку для установки нового пароля.</p>
        </div>
        <form class="form" method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button class="btn btn--primary btn--block">Отправить ссылку</button>
        </form>
        <p class="auth-card__alt">Вспомнили пароль? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</div></main>
{% endblock %}
